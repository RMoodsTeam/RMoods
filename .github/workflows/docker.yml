name: Build & Push Docker Images

on:
  release:
    types: [ published ]
  workflow_dispatch: # allows for manual triggering of the workflow
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

jobs:
  docker_nlp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build NLP image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rmoods:nlp-${{ github.ref_name }} .

      - name: Push NLP image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rmoods:nlp-${{ github.ref_name }}

  docker_backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rmoods:backend-${{ github.ref_name }} .

      - name: Push Backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rmoods:backend-${{ github.ref_name }}